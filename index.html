<title>열혈톡 앱 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f2fb; --surface:#ffffff; --surface-2:#f1eefb; --surface-3:#e7e2f6;
  --ink:#1e1a2e; --ink-2:#6a6486; --ink-3:#9d97b5;
  --line:#eae6f6; --line-2:#f3f0fb;
  --accent:#6d47d9; --accent-2:#8b6ef0; --accent-soft:#efeafd; --on-accent:#ffffff;
  --crit:#e04b57; --crit-soft:#fdeaec;
  --warn:#b57e12; --warn-soft:#fbf1dc;
  --keep:#1f9e6a; --keep-soft:#e2f5ec;
  --info:#4b6ad0; --info-soft:#eaeefb;
  --grid:#ece7f8;
  --hero-a:#2b2450; --hero-b:#4a32a6; --hero-c:#6d47d9;
  --shadow:0 1px 2px rgba(40,25,80,.05),0 8px 22px rgba(40,25,80,.07);
  --shadow-lg:0 2px 8px rgba(40,25,80,.09),0 24px 50px rgba(40,25,80,.16);
  --radius:16px; --radius-sm:11px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100d1c; --surface:#1a1730; --surface-2:#221d3b; --surface-3:#2b2548;
  --ink:#efeafc; --ink-2:#a9a2c8; --ink-3:#6f688c;
  --line:#2b2548; --line-2:#211c3a;
  --accent:#9d84f5; --accent-2:#b6a3ff; --accent-soft:#241d45; --on-accent:#161228;
  --crit:#ff7a86; --crit-soft:#33161c;
  --warn:#e6b34a; --warn-soft:#2c2410;
  --keep:#48d69a; --keep-soft:#0f2a1f;
  --info:#8aa2ff; --info-soft:#1a2144;
  --grid:#2a2448;
  --hero-a:#241d45; --hero-b:#3b2a86; --hero-c:#6d47d9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 28px 60px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#100d1c; --surface:#1a1730; --surface-2:#221d3b; --surface-3:#2b2548;
  --ink:#efeafc; --ink-2:#a9a2c8; --ink-3:#6f688c;
  --line:#2b2548; --line-2:#211c3a;
  --accent:#9d84f5; --accent-2:#b6a3ff; --accent-soft:#241d45; --on-accent:#161228;
  --crit:#ff7a86; --crit-soft:#33161c;
  --warn:#e6b34a; --warn-soft:#2c2410;
  --keep:#48d69a; --keep-soft:#0f2a1f;
  --info:#8aa2ff; --info-soft:#1a2144;
  --grid:#2a2448;
  --hero-a:#241d45; --hero-b:#3b2a86; --hero-c:#6d47d9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 28px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--accent) 10%,var(--bg)) 0%,var(--bg) 55%);
  color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* stage + phone */
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.phone{width:100%;max-width:412px;height:min(884px,calc(100vh - 36px));background:var(--surface);
  border-radius:44px;box-shadow:var(--shadow-lg),0 0 0 10px #14101f,0 0 0 12px #2a2340;
  display:flex;flex-direction:column;overflow:hidden;position:relative}
.stage .cap{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-align:center;max-width:412px}
@media (max-width:480px){
  .stage{padding:0;gap:0}
  .phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .stage .cap{display:none}
}

/* iOS status */
.ios{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 24px 3px;
  font-size:13px;font-weight:600;background:var(--surface);color:var(--ink)}
.ios .r{display:flex;align-items:center;gap:6px}
.ios svg{display:block}

/* app top bar */
.statusbar{flex:0 0 auto;padding:6px 16px 10px;display:flex;align-items:center;gap:9px;
  background:var(--surface);border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-size:14px;box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.roleseg{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.roleseg button{font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;color:var(--ink-3);white-space:nowrap}
.roleseg button.on{background:var(--accent);color:var(--on-accent)}
.livebtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  font-weight:600;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.livebtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.livebtn .d{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.livebtn.on .d{background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* appbar */
.appbar{flex:0 0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:54px;
  background:var(--surface);border-bottom:1px solid var(--line-2)}
.appbar .back{font-size:22px;color:var(--ink-2);margin:-4px 0 -4px -4px;width:30px;height:30px;border-radius:8px}
.appbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.15}
.appbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:400}
.appbar .sp{margin-left:auto}
.appbar .act{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;color:var(--ink-2)}

/* view */
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.view::-webkit-scrollbar{width:0}
.pad{padding:16px}

/* tabbar */
.tabbar{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;color:var(--ink-3)}
.tabbar button .ti{font-size:20px;line-height:1;position:relative}
.tabbar button .tl{font-size:10px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar .badge{position:absolute;top:-4px;right:-9px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;
  background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}

/* generic */
.sechd{font-size:12px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.sechd .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:"IBM Plex Sans KR";color:var(--accent);font-size:12px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* dark hero */
.dhero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);
  color:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow-lg)}
.dhero .cw{position:absolute;right:-6px;bottom:-24px;font-size:106px;opacity:.14;line-height:1}
.dhero .dh-k{font-size:12px;opacity:.85;position:relative}
.dhero .dh-v{font-size:34px;font-weight:700;margin-top:2px;position:relative;letter-spacing:-.02em}
.dhero .dh-d{font-size:12px;margin-top:3px;position:relative;color:#bff2d3;font-weight:600}
.dcav{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;position:relative}
.dstats>div{padding:0 10px;border-left:1px solid rgba(255,255,255,.2)}
.dstats>div:first-child{border-left:none;padding-left:0}
.dstats .k{font-size:9.5px;opacity:.82;display:flex;align-items:center;gap:3px}
.dstats .v{font-size:14px;font-weight:700;margin-top:5px}
.wpill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.22);color:#fff}

/* list rows */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.av{width:44px;height:44px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;flex:0 0 auto;position:relative;border:1px solid var(--line)}
.av .on-dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--keep);border:2px solid var(--surface)}
.row .main{flex:1;min-width:0}
.row .tt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.row .pv{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.row .tm{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.gp{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;
  background:color-mix(in srgb,var(--gc,var(--accent)) 15%,transparent);color:var(--gc,var(--accent));white-space:nowrap}

/* chat */
.chatwrap{display:flex;flex-direction:column;min-height:100%}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}
.day{align-self:center;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;background:var(--surface);
  border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin:4px 0}
.sysmsg{align-self:center;font-size:11px;color:var(--ink-2);text-align:center;background:var(--surface-2);border-radius:10px;padding:5px 12px;max-width:85%}
.b{max-width:80%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.42;box-shadow:var(--shadow);word-break:break-word}
.b.in{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.b.out{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;align-self:flex-end}
.b .who{font-size:10px;font-family:"IBM Plex Mono",monospace;color:var(--ink-3);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.b .tm{font-size:9px;opacity:.6;margin-top:3px;font-family:"IBM Plex Mono",monospace}
.dono{align-self:stretch;background:linear-gradient(105deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;
  border-radius:15px;padding:12px 14px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.dono::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.dono .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.dono .amt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:18px}
.dono .bg{font-size:9px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px;letter-spacing:.06em;font-weight:600}
.dono .nm{font-size:11.5px;opacity:.9;margin-top:3px;position:relative}
.dono .tx{font-size:13.5px;margin-top:7px;position:relative;line-height:1.4}
.composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--line);align-items:flex-end}
.composer input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:22px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:17px;flex:0 0 auto}

/* tray */
.tray{margin:14px 14px 0;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:14px;padding:12px 14px}
.tray .th{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--warn)}
.tray .ti{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;font-size:12.5px}
.tray .ti b{color:var(--ink)}
.tray .rep{font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:3px 10px;flex:0 0 auto}

/* fan filters */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* fan profile */
.field{margin-top:14px}
.field label{font-size:11px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.field textarea{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);resize:none;min-height:60px}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.tag.add{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line)}
.histrow{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.histrow:last-child{border-bottom:none}
.histrow .a{font-weight:600;color:var(--keep);font-family:"IBM Plex Mono",monospace}
.achrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.achrow:last-child{border-bottom:none}
.achrow .ad{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono"}
.nextbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.nextbar .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.ptrack{height:12px;background:var(--surface-2);border-radius:7px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.pfill{height:100%;border-radius:7px}

/* notifications */
.nrow{display:flex;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.nrow:last-child{border-bottom:none}
.nrow.unread{background:var(--accent-soft)}
.nic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.nic.presence{background:var(--keep-soft)}.nic.dono{background:var(--accent-soft)}.nic.grade{background:var(--warn-soft)}.nic.system{background:var(--info-soft)}
.nrow .nt{font-size:13.5px}.nrow .nt b{font-weight:600}
.nrow .ntm{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-top:3px}

/* insights */
.metgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.metcard .k{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:5px;font-weight:600}
.metcard .v{font-size:23px;font-weight:700;margin-top:6px}
.metcard .v small{font-size:12px;color:var(--ink-3);font-weight:600}
.mbar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.mbar .f{height:100%;border-radius:5px}
.chartcard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.chartcard .ctop{display:flex;justify-content:space-between;align-items:flex-start}
.chartcard h3{margin:0 0 2px;font-size:14.5px;font-weight:600}
.chartcard .cs{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.chartcard .cbig{font-size:18px;font-weight:700;text-align:right}
.chartcard .cbig .dl{font-size:11px;font-weight:600;color:var(--keep)}
.chartcard svg{display:block;width:100%;height:auto;overflow:visible}
.tierbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px}
.tierbar .lb{width:66px;flex:0 0 auto;display:flex;align-items:center;gap:4px;font-weight:600}
.tierbar .track{flex:1;height:12px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.tierbar .fill{height:100%;border-radius:7px}
.tierbar .vv{width:26px;text-align:right;font-family:"IBM Plex Mono",monospace;color:var(--ink-2);flex:0 0 auto}
.perf3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:2px}
.perf3>div{background:var(--surface);padding:12px 6px;text-align:center}
.perf3 .k{font-size:10px;color:var(--ink-3)}
.perf3 .v{font-size:16px;font-weight:700;margin:5px 0 2px}
.perf3 .dl{font-size:10.5px;color:var(--keep);font-weight:600}
.evrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.evrow:last-child{border-bottom:none}
.evrow .dd{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:3px 9px;font-family:"IBM Plex Mono"}
.goalbar{height:20px;background:var(--surface-2);border-radius:11px;overflow:hidden;margin-top:8px;position:relative;border:1px solid var(--line)}
.goalfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:11px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.goalfill span{font-size:10px;font-weight:700;color:#fff;font-family:"IBM Plex Mono",monospace}

/* tier cards */
.tiercards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tcard{border:1px solid var(--line);border-radius:13px;padding:11px 5px;text-align:center;background:var(--surface)}
.tcard.cur{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.tcard .c{font-size:20px}
.tcard .n{font-size:12px;font-weight:700;margin-top:4px}
.tcard .m{font-size:9px;color:var(--ink-3);margin-top:3px;font-family:"IBM Plex Mono"}

/* settings */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-2)}
.setrow:last-child{border-bottom:none}
.setrow.sub{padding-left:24px}
.setrow .sl{flex:1}.setrow .sl b{font-size:14px;font-weight:600}.setrow .sl p{margin:2px 0 0;font-size:11.5px;color:var(--ink-3)}
.setrow .sv{font-size:12.5px;color:var(--ink-2);font-family:"IBM Plex Mono",monospace}
.tgl{width:44px;height:26px;border-radius:14px;background:var(--surface-3);position:relative;flex:0 0 auto;transition:.2s}
.tgl.on{background:var(--keep)}

/* ---------- charts ---------- */
function lineChart(vals,labels){
  const W=320,H=140,pl=6,pr=10,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,max=Math.max(...vals)*1.14||1;
  const X=i=>pl+iw/(vals.length-1)*i,Y=v=>pt+ih-(v/max)*ih;
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pl} ${pt+ih} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${X(vals.length-1).toFixed(1)} ${pt+ih} Z`;
  const grid=[.5,1].map(g=>`<line x1="${pl}" y1="${(pt+ih-g*ih).toFixed(1)}" x2="${W-pr}" y2="${(pt+ih-g*ih).toFixed(1)}" stroke="var(--grid)" stroke-dasharray="2 4"/>`).join("");
  const dots=pts.map((p,i)=>i===pts.length-1?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>`:`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.3" fill="var(--accent)"/>`).join("");
  const lbls=labels.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="일별 후원 추이"><defs><linearGradient id="don" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#don)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbls}</svg>`;
}
function sparkline(vals){
  const W=320,H=70,pl=4,pr=26,pt=8,ih=54,max=Math.max(...vals),min=Math.min(...vals),rng=max-min||1;
  const pts=vals.map((v,i)=>[pl+(W-pl-pr)/(vals.length-1)*i,pt+ih-(v-min)/rng*ih]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pl} ${pt+ih} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${pts[pts.length-1][0].toFixed(1)} ${pt+ih} Z`;
  const end=pts[pts.length-1];

/* ================= ACTIONS ================= */
function sendMsg(id){
  const ci=$("#ci");if(!ci)return;const tx=ci.value.trim();if(!tx)return;state.drafts[id]="";
  if(!state.msgs[id])state.msgs[id]=[{t:"day",text:"오늘"}];
  if(state.role==="creator")state.msgs[id].push({from:"out",text:tx,tm:nowT()});
  else state.msgs[id].push({from:"in",fid:"me",text:tx,tm:nowT()});
  renderView();renderTabbar();
}
function doDonate(){
  const amt=state.donPreset,msg=($("#donmsg")?$("#donmsg").value.trim():"")||"응원합니다!",f=me(),before=tierOf(f.cum).key;
  f.cum+=amt;f.seenMin=0;f.online=true;f.count=(f.count||0)+1;f.temp=Math.min(100,f.temp+1);
  state.msgs.official.push({from:"dono",fid:"me",amt,text:msg,tm:nowT()});
  state.tray.push({fid:"me",amt,text:msg});state.myDonHist.unshift({d:"오늘",a:amt});state.goal.cur+=amt;
  state.notifs.unshift({type:"dono",title:`<b>${tierOf(f.cum).emoji} ${tierOf(f.cum).name} '${f.name}'</b>님이 ${won(amt)} 후원`,sub:"크루 공식방 · 후원톡 도착",min:0,unread:true});
  const after=tierOf(f.cum).key;
  if(tierIdx(after)>tierIdx(before)){const t=tierOf(f.cum);
    state.msgs.official.push({from:"sys",text:`🎉 ${f.name}님이 ${t.emoji} ${t.name} 등급으로 올라섰어요!`});
    state.notifs.unshift({type:"grade",title:`<b>'${f.name}'</b>님이 ${t.emoji}${t.name}로 등급 상승`,sub:`누적 ${won(f.cum)} 달성 · 카카오 알림톡 자동 발송됨`,min:0,unread:true});
    toast(`🎉 ${t.emoji} ${t.name} 등급으로 상승!`);
  }else toast(`🎁 ${won(amt)} 후원 완료!`);
  render();
}
function liveTick(){
  const pool=state.fans.filter(f=>f.id!=="me"),f=pool[Math.floor(Math.random()*pool.length)],r=Math.random();
  if(r<0.4){
    const amt=[3000,5000,10000,30000,50000][Math.floor(Math.random()*5)],before=tierOf(f.cum).key;
    f.cum+=amt;f.online=true;f.seenMin=0;f.count=(f.count||0)+1;
    const t2=["대박이에요 🔥","오늘도 최고!","힘내세요 💪","콘텐츠 미쳤다ㅋㅋ","항상 응원합니다","이거 실화?"];
    const tx=t2[Math.floor(Math.random()*t2.length)];
    state.msgs.official.push({from:"dono",fid:f.id,amt,text:tx,tm:nowT()});state.tray.push({fid:f.id,amt,text:tx});state.goal.cur+=amt;
    state.notifs.unshift({type:"dono",title:`<b>${tierOf(f.cum).emoji} ${tierOf(f.cum).name} '${f.name}'</b>님이 ${won(amt)} 후원`,sub:"후원톡 도착",min:0,unread:true});
    const after=tierOf(f.cum).key;
    if(tierIdx(after)>tierIdx(before)){const t=tierOf(f.cum);state.msgs.official.push({from:"sys",text:`🎉 ${f.name}님이 ${t.emoji} ${t.name} 등급으로 올라섰어요!`});state.notifs.unshift({type:"grade",title:`<b>'${f.name}'</b>님이 ${t.emoji}${t.name}로 등급 상승`,sub:`누적 ${won(f.cum)} 달성 · 알림톡 자동 발송`,min:0,unread:true});}
  }else if(r<0.72){
    const t2=["ㅋㅋㅋㅋㅋ","오늘 방송 언제해요?","저 왔어요~","화이팅!!","다들 안녕하세요","이번 콘텐츠 기대됨"];
    const ch=Math.random()<0.7?"official":"free";state.msgs[ch].push({from:"in",fid:f.id,text:t2[Math.floor(Math.random()*t2.length)],tm:nowT()});
  }else if(r<0.9){
    if(!f.online){f.online=true;f.seenMin=0;if(isVIP(f.cum))state.notifs.unshift({type:"presence",title:`<b>${tierOf(f.cum).emoji} ${tierOf(f.cum).name} '${f.name}'</b>님이 접속했어요`,sub:`누적 ${won(f.cum)} · 단골 접속`,min:0,unread:true});}
  }else{if(f.online&&Math.random()<0.5){f.online=false;f.seenMin=1;}}
  if(state.notifs.length>40)state.notifs.length=40;
  ["official","free","vvip","svip"].forEach(k=>{if(state.msgs[k]&&state.msgs[k].length>60)state.msgs[k].splice(1,state.msgs[k].length-60);});
  const typing=document.activeElement&&["ci","donmsg","memo"].includes(document.activeElement.id);
  if(!typing)renderView();renderTabbar();
}
let liveTimer;
function toggleLive(){state.live=!state.live;if(state.live){liveTimer=setInterval(liveTick,3200);toast("⚡ 실시간 시뮬레이션 시작");}else{clearInterval(liveTimer);toast("실시간 시뮬레이션 정지");}render();}
function segSheet(){const list=filterFans(),fl=FILTERS.find(f=>f[0]===state.filter)[1];
  openSheet(`<h3 class="sh">✈️ 세그먼트 발송</h3><p class="sd">현재 세그먼트 <b>「${fl}」 ${list.length}명</b>에게만 메시지를 보냅니다.</p><textarea id="segmsg" rows="3" placeholder="예: VVIP 여러분만을 위한 깜짝 이벤트 안내드려요! 🎉"></textarea><button class="btn" data-act="dosegsend">${list.length}명에게 발송</button><button class="btn ghost" data-act="closesheet">취소</button>`);}
function winbackSheet(){const list=state.fans.filter(f=>f.seenMin>=14*1440);
  openSheet(`<h3 class="sh">💌 복귀 유도 발송</h3><p class="sd">14일 이상 미접속한 팬 <b>${list.length}명</b>에게 복귀 리마인드를 보냅니다. (카카오 알림톡 연동)</p><textarea id="wbmsg" rows="3">보고 싶어요! 오랜만에 방송에서 만나요 💜 복귀하시면 특별 혜택이 기다려요.</textarea><button class="btn" data-act="dowinback">${list.length}명에게 발송</button><button class="btn ghost" data-act="closesheet">취소</button>`);}
function addTagSheet(id){openSheet(`<h3 class="sh"># 태그 추가</h3><p class="sd">${esc(fanById(id).name)}님에게 태그를 붙입니다.</p><input id="taginput" placeholder="예: VIP, 생일3월, 큰손" autocomplete="off"><button class="btn" data-act="doaddtag" data-v="${id}">추가</button>`);}

$("#phone").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,v=el.dataset.v;
  switch(act){
    case"obnext":if(state.slide<2)state.slide++;else state.screen="login";render();break;
    case"obdot":state.slide=parseInt(v);render();break;
    case"gologin":state.screen="login";render();break;
    case"dologin":state.screen="app";state.role="creator";render();toast("환영합니다! 🎉 열혈톡에 로그인했어요");break;
    case"logout":if(state.live){clearInterval(liveTimer);state.live=false;}state.screen="onboarding";state.slide=0;state.sub=null;render();break;
    case"role":state.role=v;state.sub=null;state.param=null;if(v==="donator")state.dtab="lounge";render();break;
    case"live":toggleLive();break;
    case"tab":if(state.role==="creator")state.ctab=v;else state.dtab=v;state.sub=null;state.param=null;render();break;
    case"dtab":state.dtab=v;state.sub=null;render();break;
    case"back":state.sub=null;state.param=null;render();break;
    case"open":state.sub="room";state.param=v;render();break;
    case"fan":state.sub="fan";state.param=v;render();break;
    case"send":sendMsg(v);break;
    case"filter":state.filter=v;renderView();break;
    case"readall":state.notifs.forEach(n=>n.unread=false);render();toast("모든 알림을 읽음 처리했어요");break;
    case"segsheet":segSheet();break;
    case"dosegsend":closeSheet();toast(`✈️ ${filterFans().length}명에게 발송 완료`);break;
    case"winback":winbackSheet();break;
    case"dowinback":closeSheet();toast("💌 복귀 유도 발송 완료");break;
    case"addtag":addTagSheet(v);break;
    case"doaddtag":{const t=$("#taginput").value.trim();if(t)fanById(v).tags.push(t);closeSheet();renderView();break;}
    case"savememo":fanById(v).memo=$("#memo").value;toast("메모를 저장했어요");break;
    case"benefit":toast("🎁 맞춤 혜택 설정 열림 (프로토타입)");break;
    case"savetiers":document.querySelectorAll("[data-tier]").forEach(inp=>{const t=TIERS.find(x=>x.key===inp.dataset.tier);t.min=parseInt(inp.value.replace(/\D/g,""))||0;});toast("임계값 저장 · 전체 등급 재산정 완료");render();break;
    case"rule":state.alertRules[v]=!state.alertRules[v];renderView();break;
    case"kakao":state.kakao[v]=!state.kakao[v];renderView();break;
    case"preset":state.donPreset=parseInt(v);renderView();break;
    case"donate":doDonate();break;
    case"replytray":state.tray.splice(parseInt(v),1);state.sub="room";state.param="official";state.ctab="chat";render();toast("후원톡에 답장하러 이동");break;
    case"closesheet":closeSheet();break;
  }
});
render();
</script>
