<title>열혈톡 앱 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#fbfbfc; --surface:#ffffff; --surface-2:#f4f4f6; --surface-3:#e9e9ec;
  --ink:#16161a; --ink-2:#68686f; --ink-3:#9a9aa2;
  --line:#ececef; --line-2:#f4f4f6;
  --accent:#16161a; --accent-2:#3a3a42; --accent-soft:#f0f0f2; --on-accent:#ffffff;
  --crit:#d1444f; --crit-soft:#fbeaec;
  --warn:#96702a; --warn-soft:#f4efe4;
  --keep:#2f8f66; --keep-soft:#e6f2ec;
  --info:#4d6a94; --info-soft:#eef1f6;
  --grid:#eeeeef;
  --hero-a:#16161a; --hero-b:#2a2a32; --hero-c:#45454f;
  --shadow:0 1px 2px rgba(20,20,28,.05),0 8px 22px rgba(20,20,28,.06);
  --shadow-lg:0 2px 8px rgba(20,20,28,.08),0 24px 50px rgba(20,20,28,.12);
  --radius:16px; --radius-sm:11px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e11; --surface:#18181c; --surface-2:#202025; --surface-3:#2a2a30;
  --ink:#f2f2f4; --ink-2:#a0a0aa; --ink-3:#68686f;
  --line:#2a2a30; --line-2:#202025;
  --accent:#f2f2f4; --accent-2:#c9c9cf; --accent-soft:#26262c; --on-accent:#16161a;
  --crit:#f0787f; --crit-soft:#2e1a1c;
  --warn:#d6a94f; --warn-soft:#2a2314;
  --keep:#4fc793; --keep-soft:#0f261d;
  --info:#7d9dce; --info-soft:#182231;
  --grid:#26262c;
  --hero-a:#14141a; --hero-b:#22222a; --hero-c:#3a3a45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 28px 60px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0e0e11; --surface:#18181c; --surface-2:#202025; --surface-3:#2a2a30;
  --ink:#f2f2f4; --ink-2:#a0a0aa; --ink-3:#68686f;
  --line:#2a2a30; --line-2:#202025;
  --accent:#f2f2f4; --accent-2:#c9c9cf; --accent-soft:#26262c; --on-accent:#16161a;
  --crit:#f0787f; --crit-soft:#2e1a1c;
  --warn:#d6a94f; --warn-soft:#2a2314;
  --keep:#4fc793; --keep-soft:#0f261d;
  --info:#7d9dce; --info-soft:#182231;
  --grid:#26262c;
  --hero-a:#14141a; --hero-b:#22222a; --hero-c:#3a3a45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 28px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--accent) 10%,var(--bg)) 0%,var(--bg) 55%);
  color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.verified{width:15px;height:15px;display:inline-block;vertical-align:-2px;flex:0 0 auto}
.phone{width:100%;max-width:412px;height:min(884px,calc(100vh - 36px));background:var(--surface);border-radius:44px;
  box-shadow:var(--shadow-lg),0 0 0 10px #14141f,0 0 0 12px #2c2c3c;display:flex;flex-direction:column;overflow:hidden;position:relative}
.stage .cap{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-align:center;max-width:412px}
@media (max-width:480px){.stage{padding:0;gap:0}.phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}.stage .cap{display:none}}
.ios{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 24px 3px;font-size:13px;font-weight:600;background:var(--surface);color:var(--ink)}
.ios .r{display:flex;align-items:center;gap:6px}.ios svg{display:block}
.statusbar{flex:0 0 auto;padding:6px 16px 10px;display:flex;align-items:center;gap:9px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:14px;box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.roleseg{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.roleseg button{font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;color:var(--ink-3);white-space:nowrap}
.roleseg button.on{background:var(--accent);color:var(--on-accent)}
.livebtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.livebtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.iconbtn{flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:15px}
.walletbtn{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:9px;border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));background:var(--accent-soft);color:var(--accent)}
.walletbtn .wb-ic{font-size:13px}
.walletbtn:active{transform:scale(.97)}
#gearbtn{background:none;border:none;padding:0}
.set-svg{width:30px;height:30px;display:block}
.ntb-badge{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;place-items:center;font-family:"IBM Plex Mono",monospace;display:none;line-height:1}
.ntb-badge.on{display:grid}
.livebtn .d{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.livebtn.on .d{background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.appbar{flex:0 0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:54px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.appbar .back{font-size:22px;color:var(--ink-2);margin:-4px 0 -4px -4px;width:30px;height:30px;border-radius:8px}
.appbar .hav{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;position:relative;flex:0 0 auto;border:1px solid var(--line)}
.appbar .hav .on-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--keep);border:2px solid var(--surface)}
.appbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.15}
.appbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:400;display:flex;align-items:center;gap:5px}
.appbar .sp{margin-left:auto}
.appbar .act{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;color:var(--ink-2)}
.appbar.compact{min-height:0;padding:6px 14px}
.appbar.compact h1{font-size:17px}
.hicon{font-size:19px;color:var(--ink-2);padding:2px 5px;line-height:1;flex:0 0 auto;background:none}
.searchbar{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 12px;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
.disc-search{position:relative;display:flex;align-items:center;margin-bottom:12px}
.disc-search .disc-ic{position:absolute;left:12px;font-size:14px;pointer-events:none;opacity:.55}
.disc-search .searchbar{flex:1;padding:9px 34px 9px 34px;border-radius:11px}
.disc-clr{position:absolute;right:7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3);font-size:12px;background:var(--surface-3)}
.appbar .act.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.appbar .act.on-crit{background:var(--crit-soft);color:var(--crit);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--crit) 35%,transparent)}
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.view::-webkit-scrollbar{width:0}
.pad{padding:16px}
.tabbar{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;color:var(--ink-3)}
.tabbar button .ti{font-size:20px;line-height:1;position:relative}
.tabbar button .ti .ti-svg{width:23px;height:23px;display:block}
.tabbar button .tl{font-size:10px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar .badge{position:absolute;top:-4px;right:-9px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.sechd{font-size:12px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.sechd .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:"IBM Plex Sans KR";color:var(--accent);font-size:12px;font-weight:600}
.dono-rail{display:flex;gap:13px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 14px;margin:0 -2px;scroll-snap-type:x proximity;scrollbar-width:none}
.dono-rail::-webkit-scrollbar{display:none}
.dr-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:54px;scroll-snap-align:start;background:none}
.dr-av{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:25px;position:relative;border:1.5px solid var(--line);transition:border-color .15s}
.dr-av.all{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dr-item:active .dr-av{border-color:var(--accent)}
.dr-item.on .dr-av{border-color:var(--accent);border-width:2px}
.dr-item.on .dr-nm{color:var(--accent);font-weight:600}
.dr-nm{font-size:11px;color:var(--ink-2);max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-on{position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--keep);border:2px solid var(--surface)}
.dr-unread{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--crit);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);font-family:"IBM Plex Mono",monospace}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.dhero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);color:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow-lg)}
.dhero .cw{position:absolute;right:-6px;bottom:-24px;font-size:106px;opacity:.14;line-height:1}
.dhero .dh-k{font-size:12px;opacity:.85;position:relative}
.dhero .dh-v{font-size:34px;font-weight:700;margin-top:2px;position:relative;letter-spacing:-.02em}
.dhero .dh-d{font-size:12px;margin-top:3px;position:relative;color:#bff2d3;font-weight:600}
.dcav{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;position:relative}
.dstats>div{padding:0 10px;border-left:1px solid rgba(255,255,255,.2)}
.dstats>div:first-child{border-left:none;padding-left:0}
.dstats .k{font-size:9.5px;opacity:.82;display:flex;align-items:center;gap:3px}
.dstats .v{font-size:14px;font-weight:700;margin-top:5px}
.wpill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.22);color:#fff}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.av{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:23px;flex:0 0 auto;position:relative;border:1px solid var(--line)}
.avimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.av .on-dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--keep);border:2px solid var(--surface)}
.row .main{flex:1;min-width:0}
.row .tt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.row .pv{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.row .tm{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.gp{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:color-mix(in srgb,var(--gc,var(--accent)) 15%,transparent);color:var(--gc,var(--accent));white-space:nowrap}
.fanlink{cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-decoration-thickness:1px;text-underline-offset:3px}
.fanlink:active{opacity:.55}
.ic-send{width:1em;height:1em;vertical-align:-.13em;display:inline-block}
.appbar .act .ic-block{width:18px;height:18px;display:block}
.appbar .act .ic-send{width:17px;height:17px}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.follow{font-size:12px;font-weight:700;padding:8px 15px;border-radius:20px;background:var(--accent);color:var(--on-accent);flex:0 0 auto}
.follow.on{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.cat{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chatwrap{display:flex;flex-direction:column;min-height:100%}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}
.day{align-self:center;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin:4px 0}
.sysmsg{align-self:center;font-size:11px;color:var(--ink-2);text-align:center;background:var(--surface-2);border-radius:10px;padding:5px 12px;max-width:85%}
.b{max-width:80%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.42;box-shadow:var(--shadow);word-break:break-word}
.b.in{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.b.out{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;align-self:flex-end}
.b .tm{font-size:9px;opacity:.6;margin-top:3px;font-family:"IBM Plex Mono",monospace}
.dono{align-self:flex-end;max-width:88%;background:linear-gradient(105deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:15px;padding:12px 14px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.dono.inc{align-self:flex-start}
.dono::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.dono .top{display:flex;justify-content:space-between;align-items:center;position:relative;gap:12px}
.dono .amt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:18px}
.dono .bg{font-size:9px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px;letter-spacing:.06em;font-weight:600}
.dono .tx{font-size:13.5px;margin-top:7px;position:relative;line-height:1.4}
.footwrap{position:sticky;bottom:0;background:var(--surface)}
.replybar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--accent-soft);border-top:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.replybar .rb-ic{font-size:18px;flex:0 0 auto}
.replybar .rb-txt{flex:1;min-width:0;font-size:11.5px;color:var(--ink-2)}
.replybar .rb-txt b{color:var(--accent)}
.replybar .rb-msg{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rb-x{width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--ink-3);font-size:15px;flex:0 0 auto}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);align-items:center}
.composer input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:22px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:17px;flex:0 0 auto}
.composer .dbtn{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:19px;flex:0 0 auto;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.composer .attach{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:16px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);cursor:pointer}
.room-banner{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));border-radius:12px;padding:10px 13px;margin:2px 0 8px}
.room-banner .rb-emo{font-size:18px;flex:0 0 auto}
.room-banner .rb-t{flex:1;min-width:0}
.room-banner .rb-t b{font-size:13px;display:block;color:var(--accent)}
.room-banner .rb-t span{font-size:11px;color:var(--ink-2)}
.room-banner .rb-go{color:var(--accent);font-size:16px;flex:0 0 auto}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.post-hd{display:flex;align-items:center;gap:10px}
.post-av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex:0 0 auto;cursor:pointer;display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.post-hi{flex:1;min-width:0}
.post-nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.post-tm{font-size:11px;color:var(--ink-3);margin-top:1px}
.post-del{color:var(--ink-3);font-size:18px;padding:0 6px;flex:0 0 auto}
.post-tx{font-size:14px;line-height:1.55;margin:11px 2px 0;white-space:pre-wrap;word-break:break-word}
.post-img{width:100%;border-radius:12px;margin-top:11px;display:block}
.post-act{display:flex;gap:8px;margin-top:12px}
.post-act .pa{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 13px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line)}

function tierOf(a){let t=TIERS[0];for(const x of TIERS)if(a>=x.min)t=x;return t;}
function tierIdx(k){return TIERS.findIndex(t=>t.key===k);}
function tinfo(k){return TIERS.find(t=>t.key===k)||TIERS[0];}
function AV(f){return f&&f.img?`<img class="avimg" src="${f.img}" alt="">`:(f?(f.emoji||""):"");}
const TIPS={temp:"팬 관계 온도는 팬과의 관계가 얼마나 활발한지를 0~100으로 나타낸 지표예요. 후원 빈도·최근성, 채팅 반응, 접속 활동을 종합해 산출하며, 높을수록 충성도 높고 끈끈한 관계를 뜻해요. 여기 값은 전체 팬의 평균 온도입니다."};
function infoDot(key){return `<span class="infowrap"><button class="idot" data-act="tip" data-v="${key}" aria-label="설명 보기">?</button>${state.tip===key?`<span class="tiptip">${TIPS[key]}</span>`:""}</span>`;}
function nextTier(a){const i=tierIdx(tierOf(a).key);return TIERS[i+1]||null;}
function gpill(a){const t=tierOf(a);return `<span class="gp" style="--gc:${t.color}">${t.emoji} ${t.name}</span>`;}
function fanLink(f){return `<span class="fanlink" data-act="fan" data-v="${f.id}">${esc(f.name)}</span>`;}

function normalizeTiers(){TIERS.sort((a,b)=>a.min-b.min);

  if(!last)return hideDono?"후원톡을 받았어요 🎁":"대화를 시작해보세요";
  if(last.from==="dono")return "🎁 후원톡 "+won(last.amt);
  const pre=last.from==="out"?"나: ":"";
  if(last.sticker)return pre+last.sticker;
  if(last.img)return pre+"📷 사진";
  return pre+(last.text||"");}
function threadTime(msgs){const last=[...msgs].reverse().find(x=>x.from);return last?last.tm||"":"";}
function viewThread(id){
  const p=state.role==="creator"?fanById(id):creById(id);
  p.unread=0;
  const msgs=p.thread&&p.thread.length?p.thread:[{t:"day",text:"오늘"}];
  const body=msgs.map(m=>{
    if(m.t==="day")return `<div class="day">${esc(m.text)}</div>`;
    if(m.from==="sys")return `<div class="sysmsg">${m.text}</div>`;
    if(m.from==="dono"){if(state.role==="creator")return "";const g=tierOf(p.myCum);
      return `<div class="dono"><div class="top"><div class="amt">${won(m.amt)}</div><div class="bg">${g.emoji} 후원톡</div></div>${m.text?`<div class="tx">${esc(m.text)}</div>`:""}${m.img?`<img class="dono-img" src="${m.img}" alt="첨부 이미지">`:""}</div>`;}
    const side=m.from==="out"?"out":"in";
    if(m.sticker)return `<div class="sticker ${side}">${m.sticker}</div>`;
    let inner="";if(m.img)inner+=`<img class="msg-img" src="${m.img}" alt="이미지">`;if(m.text)inner+=esc(m.text);
    return `<div class="b ${side}">${inner}<div class="tm">${m.tm||nowT()}</div></div>`;
  }).join("");
  const draft=state.drafts[id]||"";
  const dbtn=state.role==="donator"?`<button class="dbtn" data-act="donsheet" data-v="${id}" title="후원톡">🎁</button>`:"";
  const attach=`<button class="attach" data-act="emoji" data-v="${id}" title="스티커">😊</button><label class="attach" for="imgfile" title="이미지 첨부">🖼️</label><input type="file" id="imgfile" accept="image/*" hidden>`;
  const rt=state.replyTo;
  const replybar=(state.role==="creator"&&rt&&rt.fid===id)?`<div class="replybar"><span class="rb-ic">🎁</span><div class="rb-txt"><b>후원톡에 답장</b> · <span class="mono">${won(rt.amt)}</span><div class="rb-msg">“${esc(rt.text)}”</div></div><button class="rb-x" data-act="clearreply">×</button></div>`:"";
  const myRooms=state.role==="donator"?creatorRooms(id).filter(r=>!(r.kicked||[]).includes(MEFID)):[];
  const roomsBanner=myRooms.length?`<button class="room-banner" data-act="creatorrooms" data-v="${id}"><span class="rb-emo">🔒</span><div class="rb-t"><b>등급 전용 채팅방 ${myRooms.length}개</b><span>${esc(p.name)}님의 등급 전용 공간 · 입장하기</span></div><span class="rb-go">›</span></button>`:"";
  return `<div class="chatwrap"><div class="msgs">${roomsBanner}${body}</div><div class="footwrap">${replybar}<div class="composer">${attach}${dbtn}<input id="ci" placeholder="메시지 입력…" value="${esc(draft)}" autocomplete="off"><button class="send" data-act="send" data-v="${id}">➤</button></div></div></div>`;
}
function bindComposer(){const ci=$("#ci");if(ci){ci.oninput=e=>{state.drafts[state.param]=e.target.value;};ci.onkeydown=e=>{if(e.key==="Enter")sendMsg(state.param);};}
  const im=$("#imgfile");if(im)im.onchange=e=>handleImg(e,state.param,false);}
function handleImg(e,id,isDono){const file=e.target.files&&e.target.files[0];if(!file)return;
  if(file.size>4*1024*1024){toast("이미지는 4MB 이하만 첨부할 수 있어요");e.target.value="";return;}
  const r=new FileReader();r.onload=()=>{
    if(isDono){const cur=$("#donmsg");if(cur)state.drafts.donmsg=cur.value;state.donImg=r.result;donSheet(id);}
    else{const p=state.role==="creator"?fanById(id):creById(id);if(!p.thread)p.thread=[{t:"day",text:"오늘"}];p.thread.push({from:"out",img:r.result,tm:nowT()});if(state.role==="creator")state.dtalks.forEach(d=>{if(d.fid===id)d.answered=true;});state.replyTo=null;renderView();toast("📷 이미지를 보냈어요");}
  };r.readAsDataURL(file);}
const STICKERS=["❤️","🎉","👍","🔥","😂","😍","🥹","👏","💜","🙏","💪","✨","🎁","🌟","😭","🤩","🥳","😎"];
function emojiSheet(id){openSheet(`<h3 class="sh">스티커 보내기</h3><div class="emoji-grid">${STICKERS.map(s=>`<button class="emoji-btn" data-act="sticker" data-v="${id}|${s}">${s}</button>`).join("")}</div>`);}

  const body=(r.thread||[]).map(m=>{

function msgInbox(){
  const all=state.fans.filter(f=>!f.blocked),totalUnread=all.reduce((a,f)=>a+f.unread,0),mf=state.msgFilter||"all";
  const q=(state.searchQuery||"").trim().toLowerCase(),searching=state.searchOpen&&q;
  let list;
  if(searching)list=all.filter(f=>f.name.toLowerCase().includes(q)||(f.thread||[]).some(m=>(m.text||"").toLowerCase().includes(q)));
  else{list=all.slice().sort((a,b)=>(b.unread-a.unread)||(a.seenMin-b.seenMin));if(mf==="unread")list=list.filter(f=>f.unread>0);}
  const chips=searching?"":`<div class="chips" style="padding:2px 0 12px"><button class="chip ${mf==="all"?"on":""}" data-act="msgfilter" data-v="all">전체</button><button class="chip ${mf==="unread"?"on":""}" data-act="msgfilter" data-v="unread">안읽음${totalUnread?` <span class="chip-badge">${totalUnread}</span>`:""}</button></div>`;
  const rows=list.map(f=>{let pv=esc(threadPreview(f.thread,true));
    if(searching&&!f.name.toLowerCase().includes(q)){const mm=[...(f.thread||[])].reverse().find(m=>(m.text||"").toLowerCase().includes(q));if(mm)pv=`💬 ${esc(mm.text)}`;}
    return `<button class="row" data-act="thread" data-v="${f.id}">
    <div class="av">${AV(f)}${f.online?'<span class="on-dot"></span>':""}</div>
    <div class="main"><div class="tt">${fanLink(f)} ${gpill(f.cum)}</div><div class="pv">${pv}</div></div>
    <div class="meta"><div class="tm">${threadTime(f.thread)||ago(f.seenMin)}</div>${f.unread?`<span class="cnt">${f.unread}</span>`:""}</div></button>`;}).join("")||`<div class="empty">${searching?"검색 결과가 없어요.":(mf==="unread"?"안읽은 채팅이 없어요.":"채팅이 없어요.")}</div>`;

}
function donoFeed(){

  const today=state.dtalks.filter(d=>d.min<24*60),todaySum=today.reduce((a,d)=>a+d.amt,0),answered=state.dtalks.filter(d=>d.answered).length,unans=state.dtalks.filter(d=>!d.answered).length,totalCum=state.fans.reduce((a,f)=>a+f.cum,0);
  const chips=[["all","전체"],["wait","미답장"],["amt","고액순"]].map(([k,l])=>`<button class="chip ${state.dtfilter===k?"on":""}" data-act="dtfilter" data-v="${k}">${l}${k==="wait"&&state.dtalks.some(d=>!d.answered)?` (${state.dtalks.filter(d=>!d.answered).length})`:""}</button>`).join("");
  const cards=list.map(d=>{const f=fanById(d.fid);
    return `<div class="dtcard ${d.answered?"":"unans"}">

function lineChart(vals,labels){const W=320,H=140,pl=6,pr=10,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,max=Math.max(...vals)*1.14||1;

const TRIGGERS=[{k:"grade",emoji:"🎉",label:"등급 달성"},{k:"bday",emoji:"🎂",label:"생일"},{k:"anniv",emoji:"💝",label:"후원 기념일"},{k:"winback",emoji:"💤",label:"휴면 팬"},{k:"live",emoji:"🔴",label:"방송 시작"},{k:"first",emoji:"⭐",label:"첫 후원"},{k:"goal",emoji:"🎯",label:"후원 목표 달성"}];
function trigInfo(k){return TRIGGERS.find(t=>t.k===k)||TRIGGERS[0];}
function autoTargets(){const n=TIERS.length;return [["all","전체 팬"],["mid",TIERS[Math.max(1,n-2)].name+" 이상"],["top",TIERS[n-1].name+" 전용"],["custom","👤 특정 팬"]];}
function targLabel(r){const k=r.target||"all";if(k==="custom")return "특정 팬 "+((r.fans||[]).length)+"명";const t=autoTargets().find(x=>x[0]===k);return t?t[1]:"전체 팬";}

  else{state.autoEdit={key:null,name:"",trigger:"grade",target:"all",fans:[],tpl:"{닉네임}님, 안녕하세요! 💜",emoji:"🎉"};}

function sparkbars(vals){const W=320,H=92,pl=6,pr=6,pt=16,pb=8,iw=W-pl-pr,ih=H-pt-pb,max=Math.max(...vals)||1,gap=iw/vals.length,bw=gap*0.55;
  let b="";vals.forEach((v,i)=>{const h=v/max*ih,x=pl+gap*i+(gap-bw)/2,y=pt+ih-h,last=i===vals.length-1;
    b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,2).toFixed(1)}" rx="3" fill="${last?"var(--accent)":"var(--surface-3)"}"/>`;
    b+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono" fill="${last?"var(--accent)":"var(--ink-3)"}">${v}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${pl}" y1="${pt+ih}" x2="${W-pr}" y2="${pt+ih}" stroke="var(--grid)"/>${b}</svg>`;}

/* ---------- 로그인 세션 (30분 유지) ---------- */
const SESSION_MS=30*60*1000;
function touchSession(){try{localStorage.setItem("heyeol-session",String(Date.now()));}catch(e){}}
function clearSession(){try{localStorage.removeItem("heyeol-session");}catch(e){}}
function initSession(){try{const ts=parseInt(localStorage.getItem("heyeol-session")||"0");if(ts&&Date.now()-ts<SESSION_MS){state.screen="app";touchSession();return;}}catch(e){}clearSession();state.screen="login";}
