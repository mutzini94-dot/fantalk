<title>열혈톡 앱 프로토타입</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f4f2fb; --surface:#ffffff; --surface-2:#f1eefb; --surface-3:#e7e2f6;
  --ink:#1e1a2e; --ink-2:#6a6486; --ink-3:#9d97b5;
  --line:#eae6f6; --line-2:#f3f0fb;
  --accent:#6d47d9; --accent-2:#8b6ef0; --accent-soft:#efeafd; --on-accent:#ffffff;
  --crit:#e04b57; --crit-soft:#fdeaec;
  --warn:#b57e12; --warn-soft:#fbf1dc;
  --keep:#1f9e6a; --keep-soft:#e2f5ec;
  --info:#4b6ad0; --info-soft:#eaeefb;
  --grid:#ece7f8;
  --hero-a:#2b2450; --hero-b:#4a32a6; --hero-c:#6d47d9;
  --shadow:0 1px 2px rgba(40,25,80,.05),0 8px 22px rgba(40,25,80,.07);
  --shadow-lg:0 2px 8px rgba(40,25,80,.09),0 24px 50px rgba(40,25,80,.16);
  --radius:16px; --radius-sm:11px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100d1c; --surface:#1a1730; --surface-2:#221d3b; --surface-3:#2b2548;
  --ink:#efeafc; --ink-2:#a9a2c8; --ink-3:#6f688c;
  --line:#2b2548; --line-2:#211c3a;
  --accent:#9d84f5; --accent-2:#b6a3ff; --accent-soft:#241d45; --on-accent:#161228;
  --crit:#ff7a86; --crit-soft:#33161c;
  --warn:#e6b34a; --warn-soft:#2c2410;
  --keep:#48d69a; --keep-soft:#0f2a1f;
  --info:#8aa2ff; --info-soft:#1a2144;
  --grid:#2a2448;
  --hero-a:#241d45; --hero-b:#3b2a86; --hero-c:#6d47d9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 28px 60px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#100d1c; --surface:#1a1730; --surface-2:#221d3b; --surface-3:#2b2548;
  --ink:#efeafc; --ink-2:#a9a2c8; --ink-3:#6f688c;
  --line:#2b2548; --line-2:#211c3a;
  --accent:#9d84f5; --accent-2:#b6a3ff; --accent-soft:#241d45; --on-accent:#161228;
  --crit:#ff7a86; --crit-soft:#33161c;
  --warn:#e6b34a; --warn-soft:#2c2410;
  --keep:#48d69a; --keep-soft:#0f2a1f;
  --info:#8aa2ff; --info-soft:#1a2144;
  --grid:#2a2448;
  --hero-a:#241d45; --hero-b:#3b2a86; --hero-c:#6d47d9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.45);
  --shadow-lg:0 2px 10px rgba(0,0,0,.5),0 28px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% -10%,color-mix(in srgb,var(--accent) 10%,var(--bg)) 0%,var(--bg) 55%);
  color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;overflow:hidden}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans KR",monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
.phone{width:100%;max-width:412px;height:min(884px,calc(100vh - 36px));background:var(--surface);border-radius:44px;
  box-shadow:var(--shadow-lg),0 0 0 10px #14101f,0 0 0 12px #2a2340;display:flex;flex-direction:column;overflow:hidden;position:relative}
.stage .cap{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-align:center;max-width:412px}
@media (max-width:480px){.stage{padding:0;gap:0}.phone{max-width:none;height:100vh;height:100dvh;border-radius:0;box-shadow:none}.stage .cap{display:none}}
.ios{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 24px 3px;font-size:13px;font-weight:600;background:var(--surface);color:var(--ink)}
.ios .r{display:flex;align-items:center;gap:6px}.ios svg{display:block}
.statusbar{flex:0 0 auto;padding:6px 16px 10px;display:flex;align-items:center;gap:9px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:14px;box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.roleseg{margin-left:auto;display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.roleseg button{font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;color:var(--ink-3);white-space:nowrap}
.roleseg button.on{background:var(--accent);color:var(--on-accent)}
.livebtn{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.livebtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.iconbtn{flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:15px}
.livebtn .d{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.livebtn.on .d{background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.appbar{flex:0 0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:54px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.appbar .back{font-size:22px;color:var(--ink-2);margin:-4px 0 -4px -4px;width:30px;height:30px;border-radius:8px}
.appbar .hav{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;position:relative;flex:0 0 auto;border:1px solid var(--line)}
.appbar .hav .on-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--keep);border:2px solid var(--surface)}
.appbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.15}
.appbar .sub{font-size:11.5px;color:var(--ink-3);font-weight:400;display:flex;align-items:center;gap:5px}
.appbar .sp{margin-left:auto}
.appbar .act{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:16px;color:var(--ink-2)}
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg)}
.view::-webkit-scrollbar{width:0}
.pad{padding:16px}
.tabbar{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border-radius:12px;color:var(--ink-3)}
.tabbar button .ti{font-size:20px;line-height:1;position:relative}
.tabbar button .tl{font-size:10px;font-weight:600}
.tabbar button.on{color:var(--accent)}
.tabbar .badge{position:absolute;top:-4px;right:-9px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.sechd{font-size:12px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:4px 2px 10px;display:flex;align-items:center;gap:8px}
.sechd .r{margin-left:auto;text-transform:none;letter-spacing:0;font-family:"IBM Plex Sans KR";color:var(--accent);font-size:12px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.dhero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);color:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow-lg)}
.dhero .cw{position:absolute;right:-6px;bottom:-24px;font-size:106px;opacity:.14;line-height:1}
.dhero .dh-k{font-size:12px;opacity:.85;position:relative}
.dhero .dh-v{font-size:34px;font-weight:700;margin-top:2px;position:relative;letter-spacing:-.02em}
.dhero .dh-d{font-size:12px;margin-top:3px;position:relative;color:#bff2d3;font-weight:600}
.dcav{width:52px;height:52px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:0 0 auto}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;position:relative}
.dstats>div{padding:0 10px;border-left:1px solid rgba(255,255,255,.2)}
.dstats>div:first-child{border-left:none;padding-left:0}
.dstats .k{font-size:9.5px;opacity:.82;display:flex;align-items:center;gap:3px}
.dstats .v{font-size:14px;font-weight:700;margin-top:5px}
.wpill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.22);color:#fff}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row:active{background:var(--surface-2)}
.av{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:23px;flex:0 0 auto;position:relative;border:1px solid var(--line)}
.av .on-dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--keep);border:2px solid var(--surface)}
.row .main{flex:1;min-width:0}
.row .tt{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14.5px}
.row .pv{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.row .tm{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.gp{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;background:color-mix(in srgb,var(--gc,var(--accent)) 15%,transparent);color:var(--gc,var(--accent));white-space:nowrap}
.fanlink{cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-decoration-thickness:1px;text-underline-offset:3px}
.fanlink:active{opacity:.55}
.cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:10px;font-weight:700;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.follow{font-size:12px;font-weight:700;padding:8px 15px;border-radius:20px;background:var(--accent);color:var(--on-accent);flex:0 0 auto}
.follow.on{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.cat{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.chatwrap{display:flex;flex-direction:column;min-height:100%}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:9px}
.day{align-self:center;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin:4px 0}
.sysmsg{align-self:center;font-size:11px;color:var(--ink-2);text-align:center;background:var(--surface-2);border-radius:10px;padding:5px 12px;max-width:85%}
.b{max-width:80%;padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.42;box-shadow:var(--shadow);word-break:break-word}
.b.in{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.b.out{background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;align-self:flex-end}
.b .tm{font-size:9px;opacity:.6;margin-top:3px;font-family:"IBM Plex Mono",monospace}
.dono{align-self:flex-end;max-width:88%;background:linear-gradient(105deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:15px;padding:12px 14px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.dono.inc{align-self:flex-start}
.dono::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.dono .top{display:flex;justify-content:space-between;align-items:center;position:relative;gap:12px}
.dono .amt{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:18px}
.dono .bg{font-size:9px;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px;letter-spacing:.06em;font-weight:600}
.dono .tx{font-size:13.5px;margin-top:7px;position:relative;line-height:1.4}
.footwrap{position:sticky;bottom:0;background:var(--surface)}
.replybar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--accent-soft);border-top:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.replybar .rb-ic{font-size:18px;flex:0 0 auto}
.replybar .rb-txt{flex:1;min-width:0;font-size:11.5px;color:var(--ink-2)}
.replybar .rb-txt b{color:var(--accent)}
.replybar .rb-msg{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rb-x{width:24px;height:24px;border-radius:50%;background:var(--surface);color:var(--ink-3);font-size:15px;flex:0 0 auto}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);align-items:center}
.composer input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:22px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--ink);min-width:0}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:17px;flex:0 0 auto}
.composer .dbtn{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:19px;flex:0 0 auto;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.composer .attach{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:16px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);cursor:pointer}
.msg-img{display:block;max-width:190px;max-height:220px;border-radius:11px;margin-bottom:3px;object-fit:cover}
.b.out .msg-img{border:1px solid rgba(255,255,255,.25)}
.sticker{font-size:56px;line-height:1;padding:2px 4px}
.sticker.out{align-self:flex-end}.sticker.in{align-self:flex-start}
.dono-img{display:block;max-width:100%;border-radius:10px;margin-top:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emoji-btn{font-size:29px;padding:8px 0;border-radius:12px;background:var(--surface-2)}
.emoji-btn:active{background:var(--accent-soft)}
.emoji-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.emoji-mini{font-size:19px;width:40px;height:40px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.dono-thumb-wrap{position:relative;display:inline-block;margin-top:12px}
.dono-thumb{max-width:120px;max-height:120px;border-radius:12px;display:block;border:1px solid var(--line)}
.thumb-x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:15px;box-shadow:var(--shadow)}
.subtabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.subtabs button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:5px}
.subtabs button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.subtabs .sb{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:9px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.dtcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.dtcard.unans{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.dt-top{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.dt-top .av{width:40px;height:40px;border-radius:12px;font-size:20px}
.dt-top .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.dt-top .tm{font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;margin-top:2px}
.dt-amt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:18px;color:var(--accent);white-space:nowrap}
.dt-msg{padding:2px 14px 12px;font-size:14px;color:var(--ink);line-height:1.45}
.dt-foot{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line-2);background:var(--surface-2)}
.dt-status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.dt-status.wait{background:var(--warn-soft);color:var(--warn)}
.dt-status.done{background:var(--keep-soft);color:var(--keep)}
.dt-reply{margin-left:auto;font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:20px;padding:7px 15px}
.dt-reply.ghost{background:var(--surface);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{margin-top:14px}
.field label{font-size:11px;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.field textarea{width:100%;margin-top:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:13.5px;font-family:inherit;color:var(--ink);resize:none;min-height:60px}
.taglist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
.tag.add{background:var(--surface-2);color:var(--ink-3);border:1px dashed var(--line)}
.histrow{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.histrow:last-child{border-bottom:none}
.histrow .a{font-weight:600;color:var(--keep);font-family:"IBM Plex Mono",monospace}
.achrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.achrow:last-child{border-bottom:none}.achrow .ad{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-family:"IBM Plex Mono"}
.nextbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.nextbar .top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.ptrack{height:12px;background:var(--surface-2);border-radius:7px;overflow:hidden;margin-top:8px;border:1px solid var(--line)}

function getFilters(){const n=TIERS.length;return [["all","전체"],["top","👑 "+TIERS[n-1].name],["high","💜 "+TIERS[n-2].name+"+"],["risk","⚠️ 이탈 위험"],["online","🔥 온라인"],["dormant","💤 휴면"]];}
function filterFans(){let f=[...state.fans];
  if(state.filter==="top")f=f.filter(x=>tierIdx(tierOf(x.cum).key)===TIERS.length-1);
  else if(state.filter==="high")f=f.filter(x=>tierIdx(tierOf(x.cum).key)>=TIERS.length-2);

function lineChart(vals,labels){const W=320,H=140,pl=6,pr=10,pt=14,pb=20,iw=W-pl-pr,ih=H-pt-pb,max=Math.max(...vals)*1.14||1;
  const X=i=>pl+iw/(vals.length-1)*i,Y=v=>pt+ih-(v/max)*ih,pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pl} ${pt+ih} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${X(vals.length-1).toFixed(1)} ${pt+ih} Z`;
  const grid=[.5,1].map(g=>`<line x1="${pl}" y1="${(pt+ih-g*ih).toFixed(1)}" x2="${W-pr}" y2="${(pt+ih-g*ih).toFixed(1)}" stroke="var(--grid)" stroke-dasharray="2 4"/>`).join("");
  const dots=pts.map((p,i)=>i===pts.length-1?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>`:`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.3" fill="var(--accent)"/>`).join("");
  const lbls=labels.map((l,i)=>`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">${l}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="don" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#don)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbls}</svg>`;}
function sparkline(vals){const W=320,H=70,pl=4,pr=26,pt=8,ih=54,max=Math.max(...vals),min=Math.min(...vals),rng=max-min||1;
  const pts=vals.map((v,i)=>[pl+(W-pl-pr)/(vals.length-1)*i,pt+ih-(v-min)/rng*ih]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pl} ${pt+ih} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${pts[pts.length-1][0].toFixed(1)} ${pt+ih} Z`,end=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="ret" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".24"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#ret)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${end[0].toFixed(1)}" cy="${end[1].toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${(end[0]-2).toFixed(1)}" y="${(end[1]-8).toFixed(1)}" text-anchor="end" font-size="10" font-family="IBM Plex Mono" font-weight="600" fill="var(--accent)">${vals[vals.length-1]}%</text></svg>`;}

function sendMsg(id){const ci=$("#ci");if(!ci)return;const tx=ci.value.trim();if(!tx)return;state.drafts[id]="";
  const p=state.role==="creator"?fanById(id):creById(id);if(!p.thread)p.thread=[{t:"day",text:"오늘"}];
  p.thread.push({from:"out",text:tx,tm:nowT()});
  if(state.role==="creator")state.dtalks.forEach(d=>{if(d.fid===id)d.answered=true;});
  state.replyTo=null;renderView();renderTabbar();}
function doDonate(id){
  const amt=state.donPreset,msg=($("#donmsg")?$("#donmsg").value.trim():"")||"응원합니다!",c=creById(id),before=tierOf(c.myCum).key;
  c.myCum+=amt;c.myTemp=Math.min(100,(c.myTemp||0)+1);if(!c.thread)c.thread=[{t:"day",text:"오늘"}];
  const talk={from:"dono",amt,text:msg,tm:nowT()};if(state.donImg)talk.img=state.donImg;c.thread.push(talk);
  state.donImg=null;state.drafts.donmsg=null;
  state.myDonHist.unshift({d:"오늘",a:amt,c:c.name});
  const after=tierOf(c.myCum).key;closeSheet();
  if(tierIdx(after)>tierIdx(before)){const t=tierOf(c.myCum);c.thread.push({from:"sys",text:`🎉 ${c.name}님과 ${t.emoji} ${t.name} 등급이 되었어요!`});toast(`🎉 ${c.name}님과 ${t.emoji} ${t.name} 등급 달성!`);}
  else toast(`🎁 ${c.name}님께 ${won(amt)} 후원 완료!`);
  setTimeout(()=>{c.thread.push({from:"in",text:"와 감사합니다 별하늘님!! 💜 항상 힘이 돼요",tm:nowT()});if(state.sub==="thread"&&state.param===id&&state.role==="donator")renderView();},900);
  render();
}
function liveTick(){
  if(state.role==="creator"){
    const pool=state.fans,f=pool[Math.floor(Math.random()*pool.length)],r=Math.random(),open=state.sub==="thread"&&state.param===f.id;
    if(r<0.4){const amt=[3000,5000,10000,30000,50000][Math.floor(Math.random()*5)],before=tierOf(f.cum).key;f.cum+=amt;f.online=true;f.seenMin=0;f.count++;
      const t2=["대박이에요 🔥","오늘도 최고!","힘내세요 💪","콘텐츠 미쳤다ㅋㅋ","항상 응원합니다"];const tx=t2[Math.floor(Math.random()*t2.length)];
      f.thread.push({from:"dono",amt,text:tx,tm:nowT()});if(!open)f.unread++;state.goal.cur+=amt;
      state.dtalks.unshift({id:"d"+Date.now(),fid:f.id,amt,text:tx,min:0,answered:false});if(state.dtalks.length>60)state.dtalks.length=60;
      state.notifs.unshift({type:"dono",fid:f.id,title:`<b>${tierOf(f.cum).emoji} ${tierOf(f.cum).name} '${f.name}'</b>님이 ${won(amt)} 후원`,sub:"1:1 채팅 · 후원톡 도착",min:0,unread:true});
      const after=tierOf(f.cum).key;if(tierIdx(after)>tierIdx(before)){const t=tierOf(f.cum);f.thread.push({from:"sys",text:`🎉 ${f.name}님이 ${t.emoji} ${t.name} 등급으로 올라섰어요!`});state.notifs.unshift({type:"grade",fid:f.id,title:`<b>'${f.name}'</b>님이 ${t.emoji}${t.name}로 등급 상승`,sub:`누적 ${won(f.cum)} · ${state.automation.on&&state.automation.rules.find(r=>r.key==="grade").on?"🔔 열혈톡 푸시 자동 발송":"알림"}`,min:0,unread:true});if(state.automation.on&&state.automation.rules.find(r=>r.key==="grade").on)state.autoperf.sent++;}
    }else if(r<0.72){const t2=["안녕하세요~","오늘 방송 언제해요?","저 왔어요!","화이팅!!","이번 콘텐츠 기대돼요","답장 기다릴게요 ㅎㅎ"];f.thread.push({from:"in",text:t2[Math.floor(Math.random()*t2.length)],tm:nowT()});if(!open)f.unread++;
    }else if(r<0.9){if(!f.online){f.online=true;f.seenMin=0;if(isVIP(f.cum)){state.notifs.unshift({type:"presence",fid:f.id,title:`<b>${tierOf(f.cum).emoji} ${tierOf(f.cum).name} '${f.name}'</b>님이 접속했어요`,sub:`누적 ${won(f.cum)} · 열혈 도네이터 접속`,min:0,unread:true});if(state.alertRules.presence)showPresenceAlert(f);}}
    }else{if(f.online&&Math.random()<0.5){f.online=false;f.seenMin=1;}}
    if(state.notifs.length>40)state.notifs.length=40;state.fans.forEach(x=>{if(x.thread.length>50)x.thread.splice(1,x.thread.length-50);});
  }else{
    const pool=state.creators.filter(c=>c.followed),c=pool[Math.floor(Math.random()*pool.length)];if(!c)return;const open=state.sub==="thread"&&state.param===c.id;
    const r=Math.random();
    if(r<0.5){const t2=["지금 방송 시작했어요! 🔴","오늘도 와주셔서 감사해요 😊","다음 콘텐츠 기대해주세요!","별하늘님 덕분에 힘나요 💜","곧 이벤트 있어요 놓치지 마세요"];c.thread.push({from:"in",text:t2[Math.floor(Math.random()*t2.length)],tm:nowT()});if(!open)c.unread++;
      state.dnotifs.unshift({type:"dono",title:`<b>${c.emoji} ${c.name}</b>님이 메시지를 보냈어요`,sub:c.thread[c.thread.length-1].text,min:0,unread:true});}
    else if(r<0.75){if(!c.online){c.online=true;state.dnotifs.unshift({type:"presence",title:`<b>${c.emoji} ${c.name}</b>님이 방송을 시작했어요`,sub:"지금 라이브 · 놓치지 마세요",min:0,unread:true});}}
    else{if(c.online&&Math.random()<0.4)c.online=false;}
    if(state.dnotifs.length>40)state.dnotifs.length=40;
  }
  const typing=document.activeElement&&["ci","donmsg","memo"].includes(document.activeElement.id);
  if(!typing)renderView();renderTabbar();
}
let liveTimer;
function toggleLive(){state.live=!state.live;if(state.live){liveTimer=setInterval(liveTick,3200);toast("⚡ 실시간 시뮬레이션 시작");}else{clearInterval(liveTimer);toast("실시간 시뮬레이션 정지");}render();}
function segSheet(){const list=filterFans(),fl=getFilters().find(f=>f[0]===state.filter)[1];
  openSheet(`<h3 class="sh">✈️ 세그먼트 발송</h3><p class="sd">현재 세그먼트 <b>「${fl}」 ${list.length}명</b>에게 단체 메시지를 보냅니다.</p><textarea id="segmsg" rows="3" placeholder="예: VVIP 여러분만을 위한 깜짝 이벤트 안내드려요! 🎉"></textarea><button class="btn" data-act="dosegsend">${list.length}명에게 발송</button><button class="btn ghost" data-act="closesheet">취소</button>`);}
function winbackSheet(){const list=state.fans.filter(f=>f.seenMin>=14*1440);
  openSheet(`<h3 class="sh">💌 복귀 유도 발송</h3><p class="sd">14일 이상 미접속한 팬 <b>${list.length}명</b>에게 복귀 리마인드를 보냅니다. (🔔 열혈톡 푸시 발송)</p><textarea id="wbmsg" rows="3">보고 싶어요! 오랜만에 방송에서 만나요 💜 복귀하시면 특별 혜택이 기다려요.</textarea><button class="btn" data-act="dowinback">${list.length}명에게 발송</button><button class="btn ghost" data-act="closesheet">취소</button>`);}
function addTagSheet(id){openSheet(`<h3 class="sh"># 태그 추가</h3><p class="sd">${esc(fanById(id).name)}님에게 태그를 붙입니다.</p><input id="taginput" placeholder="예: 큰손, 생일3월" autocomplete="off"><button class="btn" data-act="doaddtag" data-v="${id}">추가</button>`);}
function donSheet(id){const c=creById(id),presets=[5000,10000,30000,50000,100000,500000],nt=nextTier(c.myCum),toNext=nt?nt.min-c.myCum:0;
  const pad=presets.map(p=>`<button class="${state.donPreset===p?"on":""}" data-act="preset" data-v="${p}">${wonK(p)}</button>`).join("");
  const msg=state.drafts.donmsg!=null?state.drafts.donmsg:"항상 응원해요! 오늘도 화이팅 💪";
  const emojiRow=`<div class="emoji-row">${["❤️","🎉","🔥","💜","👍","😍","🙏","✨"].map(s=>`<button class="emoji-mini" data-act="donemoji" data-v="${s}">${s}</button>`).join("")}</div>`;
  const thumb=state.donImg?`<div class="dono-thumb-wrap"><img class="dono-thumb" src="${state.donImg}"><button class="thumb-x" data-act="rmdonimg">×</button></div>`:"";
  openSheet(`<h3 class="sh">🎁 ${esc(c.name)}님께 후원톡</h3><p class="sd">현재 ${tierOf(c.myCum).emoji} ${tierOf(c.myCum).name} · 누적 ${won(c.myCum)}</p>
    <div class="donpad">${pad}</div>
    <textarea id="donmsg" rows="2" style="margin-top:14px" placeholder="후원과 함께 전할 메시지">${esc(msg)}</textarea>
    ${emojiRow}
    <label class="btn ghost" for="donimgfile" style="cursor:pointer;margin-top:10px">🖼️ 사진 첨부</label><input type="file" id="donimgfile" accept="image/*" hidden>
    ${thumb}
    <button class="btn" data-act="dodonate" data-v="${id}">${won(state.donPreset)} 후원톡 보내기</button>
    ${nt&&toNext>0?`<p style="font-size:12px;color:var(--ink-3);text-align:center;margin:10px 0 0">${won(toNext)} 더 후원하면 ${nt.emoji} ${nt.name}! ${state.donPreset>=toNext?"<b style='color:var(--accent)'>이번 후원으로 승급 🎉</b>":""}</p>`:""}`);
  const ta=$("#donmsg");if(ta)ta.oninput=e=>state.drafts.donmsg=e.target.value;
  const f=$("#donimgfile");if(f)f.onchange=e=>handleImg(e,id,true);}

$("#phone").addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,v=el.dataset.v;
  switch(act){
    case"obnext":if(state.slide<2)state.slide++;else state.screen="login";render();break;
    case"obdot":state.slide=parseInt(v);render();break;
    case"gologin":state.screen="login";render();break;
    case"dologin":state.screen="app";render();toast("환영합니다! 🎉 열혈톡에 로그인했어요");break;
    case"logout":if(state.live){clearInterval(liveTimer);state.live=false;}state.screen="onboarding";state.slide=0;state.sub=null;render();break;
    case"role":state.role=v;state.sub=null;state.param=null;if(v==="donator")state.dtab="following";else state.ctab="msg";render();break;
    case"live":toggleLive();break;
    case"tab":if(state.role==="creator")state.ctab=v;else state.dtab=v;state.sub=null;state.param=null;render();break;
    case"opensettings":state.sub="settings";state.param=null;render();break;
    case"dtfilter":state.dtfilter=v;renderView();break;
    case"dtreply":{const d=state.dtalks.find(x=>x.id===v);if(d){d.answered=true;state.replyTo={fid:d.fid,amt:d.amt,text:d.text};state.sub="thread";state.param=d.fid;}render();break;}
    case"clearreply":state.replyTo=null;renderView();break;
    case"dtab":state.dtab=v;state.sub=null;render();break;
    case"back":state.sub=null;state.param=null;state.replyTo=null;render();break;
    case"thread":state.replyTo=null;state.sub="thread";state.param=v;render();break;
    case"fan":{const el=$("#alertbar");if(el)el.classList.remove("on");state.role="creator";state.sub="fan";state.param=v;render();break;}
    case"send":sendMsg(v);break;
    case"filter":state.filter=v;renderView();break;
    case"dfilter":state.dfilter=v;renderView();break;
    case"follow":{const c=creById(v);c.followed=!c.followed;if(c.followed&&!c.thread.length)c.thread=[{t:"day",text:"오늘"},{from:"in",text:`안녕하세요! 팔로우 감사해요 😊`,tm:nowT()}];toast(c.followed?`💜 ${c.name}님을 팔로우했어요`:`${c.name}님 팔로우를 취소했어요`);renderView();renderTabbar();break;}
    case"readall":state.notifs.forEach(n=>n.unread=false);render();toast("모든 알림을 읽음 처리했어요");break;
    case"dreadall":state.dnotifs.forEach(n=>n.unread=false);render();toast("모든 알림을 읽음 처리했어요");break;
    case"segsheet":segSheet();break;
    case"dosegsend":closeSheet();toast(`✈️ ${filterFans().length}명에게 발송 완료`);break;
    case"winback":winbackSheet();break;
    case"dowinback":closeSheet();toast("💌 복귀 유도 발송 완료");break;
    case"addtag":addTagSheet(v);break;
    case"doaddtag":{const t=$("#taginput").value.trim();if(t)fanById(v).tags.push(t);closeSheet();renderView();break;}
    case"savememo":fanById(v).memo=$("#memo").value;toast("메모를 저장했어요");break;
    case"benefit":toast("🎁 맞춤 혜택 설정 (프로토타입)");break;
    case"addtier":readTierRows();{const mx=Math.max(0,...TIERS.map(t=>t.min));TIERS.push({key:"t"+Date.now(),name:"새 등급",emoji:"👑",color:"#8b6ef0",min:mx+100000});}renderView();break;
    case"deltier":readTierRows();if(TIERS.length<=2){toast("등급은 최소 2개가 필요해요");break;}TIERS=TIERS.filter(t=>t.key!==v);renderView();break;
    case"savetiers":readTierRows();normalizeTiers();render();toast("등급 저장 · 전체 재산정 완료");break;
    case"rule":state.alertRules[v]=!state.alertRules[v];renderView();break;
    case"openauto":state.sub="automation";state.param=null;render();break;
    case"autotoggle":state.automation.on=!state.automation.on;renderView();break;
    case"autorule":{const r=state.automation.rules.find(x=>x.key===v);if(r)r.on=!r.on;renderView();break;}
    case"autotest":{const r=state.automation.rules.find(x=>x.key===v);state.autoperf.sent++;toast(`🔔 '${r.name}' 테스트 푸시를 보냈어요`);renderView();break;}
    case"autonew":openAutoEditor(null);break;
    case"autostat":state.sub="autostat";state.param=v;render();break;
    case"autoedit":openAutoEditor(v);break;
    case"ae-trig":{captureAE();const t=trigInfo(v);state.autoEdit.trigger=v;state.autoEdit.emoji=t.emoji;if(!state.autoEdit.name.trim())state.autoEdit.name=t.label+" 알림";autoEditorSheet();break;}
    case"ae-targ":captureAE();state.autoEdit.target=v;autoEditorSheet();break;
    case"ae-fan":{captureAE();const e=state.autoEdit;if(!e.fans)e.fans=[];const i=e.fans.indexOf(v);if(i>=0)e.fans.splice(i,1);else e.fans.push(v);autoEditorSheet();break;}
    case"ae-save":{captureAE();const e=state.autoEdit;if(!e.name.trim())e.name=trigInfo(e.trigger).label+" 알림";const fans=e.target==="custom"?(e.fans||[]):[];
      if(e.key){const r=state.automation.rules.find(x=>x.key===e.key);Object.assign(r,{name:e.name,trigger:e.trigger,target:e.target,fans,tpl:e.tpl,emoji:e.emoji});toast("자동화를 저장했어요");}
      else{state.automation.rules.push({key:"c"+Date.now(),on:true,emoji:e.emoji,name:e.name,trigger:e.trigger,target:e.target,fans,tpl:e.tpl,sent:0,open:0,conv:0,rev:0,trend:[0,0,0,0,0,0,0]});toast("새 자동화를 만들었어요 ✨");}
      state.autoEdit=null;closeSheet();renderView();break;}
    case"ae-del":{state.automation.rules=state.automation.rules.filter(x=>x.key!==state.autoEdit.key);state.autoEdit=null;closeSheet();renderView();toast("자동화를 삭제했어요");break;}
    case"donsheet":donSheet(v);break;
    case"emoji":emojiSheet(v);break;
    case"sticker":{const[sid,em]=v.split("|");sendSticker(sid,em);break;}
    case"donemoji":{const ta=$("#donmsg");if(ta){ta.value+=v;state.drafts.donmsg=ta.value;ta.focus();}break;}
    case"rmdonimg":state.donImg=null;{const ta=$("#donmsg");if(ta)state.drafts.donmsg=ta.value;}donSheet(state.param);break;
    case"preset":{const ta=$("#donmsg");if(ta)state.drafts.donmsg=ta.value;}state.donPreset=parseInt(v);if($("#sheet").classList.contains("on")&&state.sub==="thread")donSheet(state.param);break;
    case"dodonate":doDonate(v);break;
    case"closesheet":closeSheet();break;
    case"theme":applyTheme(v);render();break;
    case"openbackup":state.sub="backup";state.param=null;render();break;
    case"dobackup":doBackup();break;
    case"restorebkp":restoreBkp(parseInt(v));break;
    case"delbkp":delBkp(parseInt(v));break;
    case"fancard":fanCardSheet(v);break;
    case"sharecard":toast("🪪 팬카드를 공유했어요 (프로토타입)");break;
    case"autobackup":state.autoBackup=!state.autoBackup;try{localStorage.setItem("heyeol-autobackup",state.autoBackup?"1":"0");}catch(e){}if(state.autoBackup)doBackup();renderView();break;
    case"exportdata":exportSheet();break;
    case"importdata":importSheet();break;
    case"copyexp":{const t=$("#expjson");if(t){t.select();try{document.execCommand("copy");toast("클립보드에 복사했어요");}catch(e){toast("텍스트를 길게 눌러 복사하세요");}}break;}
    case"doimport":{const t=$("#impjson");try{restoreData(JSON.parse(t.value));closeSheet();render();toast("데이터를 복원했어요");}catch(e){toast("JSON 형식이 올바르지 않아요");}break;}
    case"alertopen":$("#alertbar").classList.remove("on");state.role="creator";state.sub="thread";state.param=v;render();break;
  }
});
initTheme();initBackupMeta();render();
</script>
